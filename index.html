    <!--
      DIRECTION CONTRACT — expenses ledger (Operate)

      THESIS: A household ledger is an instrument, not a list. It answers "is
      this normal?" while you scan, and refuses the category-donut dashboard
      every expense tracker ships.

      OWN-WORLD: Warung Padang display case. Rows are enamel plates; category
      lives in a 3px coloured rim, never in text, so every character keeps full
      contrast across 187 rows. Steel shelf rules divide days. Soft chrome,
      crisp data: containers lift, data stays flat. Inset shadow is reserved
      for input wells. Red means delete and nothing else. Themed via tokens —
      Mawar (soft rose) primary, Kobalt and Tegel Kunci secondary.

      STORY: The admin reconciles a month and finds the odd entry without
      hunting; a member records a purchase in under a minute on a phone and
      sees it at the top of the tape.

      FIRST VIEWPORT: Dark count strip printing the filter scope it counts,
      inset filter wells, then rail plus tape — rail newest-first (28 → 1),
      bar length is that day's spend, click to jump. Rows silent unless the
      household's own history says otherwise.

      FORM: Grounded candidate 6 of 7 (warung Padang case), staging "cashier's
      tape" — surface seed bba5282f, direction seed d22c4b64.
    -->
